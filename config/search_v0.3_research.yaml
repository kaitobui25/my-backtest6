# ExactBT v0.3 focused research grid.
#
# Purpose: test a few structurally different strategy families with execution
# parameters appropriate to each family. This intentionally does NOT reuse one
# ATR/RR grid for every signal type.

data:
  file: data/btcusdt_15m.parquet
  timestamp_column: auto
  active_split: train
  splits:
    train:
      start: "2021-01-01T00:00:00Z"
      end: "2024-07-01T00:00:00Z"
      locked: false
    validation:
      start: "2024-07-01T00:00:00Z"
      end: "2025-07-01T00:00:00Z"
      locked: false
    final_oos:
      start: "2025-07-01T00:00:00Z"
      end: "2026-07-01T00:00:00Z"
      locked: true

engine:
  fee_per_side: 0.0005
  slippage_per_side: 0.0002
  cancel_pending_on_new_day: true

search:
  output_dir: results
  batch_size: 48
  num_threads: 0
  # Set this to a frozen TRAIN shortlist JSON before running VALIDATION.
  shortlist_file: null

selection:
  min_expectancy_r: 0.15
  strict_expectancy: true
  min_trades: 300
  min_profit_factor: 1.3
  max_drawdown_r: null
  max_cost_share_of_gross_wins: 0.40
  near_threshold_margin_r: 0.03
  keep_best_per_strategy: 20
  detailed_records_max: 150
  # These gates are fixed before viewing later splits.
  by_split:
    validation:
      min_expectancy_r: 0.0
      strict_expectancy: true
      min_trades: 80
      min_profit_factor: 1.15
    final_oos:
      min_expectancy_r: 0.0
      strict_expectancy: true
      min_trades: 80
      min_profit_factor: 1.15

strategies:
  # Trend continuation after a real pullback and strength confirmation.
  - plugin: exactbt.strategies.research:ADX_EMA_PULLBACK_PLUGIN
    enabled: true
    parameters:
      atr_stop_window: [14]
      atr_stop_multiplier: [2.0, 3.0]
      risk_reward: [1.5, 2.0, 2.5, 3.0]
      max_hold_bars: [64, 192]
      side: [both, long, short]
      fast_ema: [20, 50]
      slow_ema: [100, 200]
      adx_window: [14]
      adx_threshold: [18, 22, 26]
      pullback_lookback: [4, 8]
      require_di: [true]

  # Intraday location: reclaim UTC daily VWAP in the higher-timeframe regime.
  - plugin: exactbt.strategies.research:DAILY_VWAP_RECLAIM_PLUGIN
    enabled: true
    parameters:
      atr_stop_window: [14]
      atr_stop_multiplier: [2.0, 3.0]
      risk_reward: [1.5, 2.0, 2.5]
      max_hold_bars: [32, 96]
      side: [both, long, short]
      regime_ema: [100, 200]
      volume_window: [20, 50]
      volume_mult: [0.8, 1.0, 1.2]
      vwap_slope_lookback: [4, 12]
      min_bars_after_reset: [4, 16]

  # Failed rolling-range breakout / liquidity sweep. Stop is beyond the wick.
  - plugin: exactbt.strategies.price_action:PLUGIN
    enabled: true
    parameters:
      level_lookback: [32, 64, 96]
      atr_window: [14, 21]
      sweep_atr: [0.0, 0.15]
      reclaim_atr: [0.0, 0.1]
      stop_atr: [0.1, 0.25]
      regime_ema: [0, 200]
      risk_reward: [1.0, 1.5, 2.0, 2.5]
      max_hold_bars: [16, 32, 64]
      side: [both, long, short]

  # Existing breakout logic, but with wider stops, longer holds and side splits.
  - plugin: exactbt.strategies.trend:ROLLING_RANGE_BREAKOUT_PLUGIN
    enabled: true
    parameters:
      atr_stop_window: [14]
      atr_stop_multiplier: [2.0, 3.0, 4.0]
      risk_reward: [2.0, 3.0, 4.0]
      max_hold_bars: [96, 192, 384]
      side: [both, long, short]
      lookback: [48, 96, 192, 384]
      atr_window: [14, 21]
      breakout_atr_buffer: [0.0, 0.25, 0.5]
      regime_ema: [100, 200]
