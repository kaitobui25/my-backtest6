# ExactBT v0.5 — focused momentum and trend-continuation research.
#
# Purpose:
# - revisit momentum/trend families from the broad v0.2 scan;
# - keep their existing close-confirmed signal definitions;
# - use wider stops, larger fixed-R targets, longer holds, and long/short splits.
#
# This config intentionally excludes breakout/volatility families. Those belong
# in a separate experiment because their range and volatility parameters create
# a different hypothesis and a much larger search space.

momentum_execution: &momentum_execution
  atr_stop_window: [14]
  atr_stop_multiplier: [2.0, 3.0, 4.0]
  risk_reward: [2.0, 3.0, 4.0]
  max_hold_bars: [96, 192, 384]
  side: [both, long, short]

data:
  file: data/btcusdt_15m.parquet
  timestamp_column: auto
  active_split: train
  splits:
    train:
      start: "2021-01-01T00:00:00Z"
      end: "2024-07-01T00:00:00Z"
      locked: false
    validation:
      start: "2024-07-01T00:00:00Z"
      end: "2025-07-01T00:00:00Z"
      locked: false
    final_oos:
      start: "2025-07-01T00:00:00Z"
      end: "2026-07-01T00:00:00Z"
      locked: true

engine:
  fee_per_side: 0.0005
  slippage_per_side: 0.0002
  cancel_pending_on_new_day: true

search:
  output_dir: results
  batch_size: 48
  num_threads: 0
  # Freeze TRAIN candidates before VALIDATION, then set this in a copied config.
  shortlist_file: null

selection:
  min_expectancy_r: 0.15
  strict_expectancy: true
  min_trades: 300
  min_profit_factor: 1.3
  max_drawdown_r: null
  max_cost_share_of_gross_wins: 0.40
  near_threshold_margin_r: 0.03
  keep_best_per_strategy: 20
  detailed_records_max: 150
  by_split:
    validation:
      min_expectancy_r: 0.0
      strict_expectancy: true
      min_trades: 80
      min_profit_factor: 1.15
    final_oos:
      min_expectancy_r: 0.0
      strict_expectancy: true
      min_trades: 80
      min_profit_factor: 1.15

strategies:
  # RSI crossed a momentum threshold in the higher-timeframe EMA regime.
  - plugin: exactbt.strategies.momentum:RSI_MOMENTUM_PLUGIN
    enabled: true
    parameters:
      <<: *momentum_execution
      rsi_window: [7, 14, 21]
      threshold: [55, 60, 65]
      regime_ema: [100, 200]

  # Percentage rate of change crossed a positive/negative threshold.
  - plugin: exactbt.strategies.momentum:ROC_MOMENTUM_PLUGIN
    enabled: true
    parameters:
      <<: *momentum_execution
      roc_window: [6, 12, 24, 48]
      threshold: [0.5, 1.0, 1.5, 2.0]
      regime_ema: [100, 200]

  # MACD line crossed its signal line with histogram and EMA-regime agreement.
  - plugin: exactbt.strategies.momentum:MACD_MOMENTUM_PLUGIN
    enabled: true
    parameters:
      <<: *momentum_execution
      fast: [8, 12]
      slow: [21, 26, 35]
      signal: [5, 9]
      regime_ema: [100, 200]

  # Pure EMA crossover benchmark, with invalid fast >= slow combinations removed
  # by the plugin validator.
  - plugin: exactbt.strategies.trend:EMA_CROSS_PLUGIN
    enabled: true
    parameters:
      <<: *momentum_execution
      fast_ema: [10, 20, 50]
      slow_ema: [50, 100, 200]

  # Trend continuation after price returns within an ATR distance of the EMA.
  - plugin: exactbt.strategies.trend:EMA_SLOPE_PULLBACK_PLUGIN
    enabled: true
    parameters:
      <<: *momentum_execution
      ema_window: [50, 100, 200]
      slope_lookback: [3, 6, 12]
      atr_window: [14, 21]
      pullback_atr: [0.25, 0.5, 1.0]
