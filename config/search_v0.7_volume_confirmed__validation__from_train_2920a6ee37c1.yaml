# ExactBT v0.7 — focused volume-confirmed research.
#
# Purpose:
# - revisit the two volume-confirmed families from the broad v0.2 scan;
# - keep signal definitions unchanged;
# - separate long/short behavior and allow enough time for confirmed moves to
#   develop without copying the execution engine.
#
# `side: both` is intentionally omitted. Long and short runs are the source of
# truth for this experiment and avoid duplicate combined-direction configs.

volume_execution: &volume_execution
  atr_stop_window: [14]
  atr_stop_multiplier: [2.0, 3.0]
  risk_reward: [2.0, 3.0, 4.0]
  max_hold_bars: [96, 192, 384]
  side: [long, short]

data:
  file: data/btcusdt_15m.parquet
  timestamp_column: auto
  active_split: train
  splits:
    train:
      start: "2021-01-01T00:00:00Z"
      end: "2024-07-01T00:00:00Z"
      locked: false
    validation:
      start: "2024-07-01T00:00:00Z"
      end: "2025-07-01T00:00:00Z"
      locked: false
    final_oos:
      start: "2025-07-01T00:00:00Z"
      end: "2026-07-01T00:00:00Z"
      locked: true

engine:
  fee_per_side: 0.0005
  slippage_per_side: 0.0002
  cancel_pending_on_new_day: true

search:
  output_dir: results
  batch_size: 48
  num_threads: 0
  shortlist_file: "config/generated/frozen_train_2920a6ee37c1_to_validation.json"

selection:
  min_expectancy_r: 0.15
  strict_expectancy: true
  min_trades: 300
  min_profit_factor: 1.3
  max_drawdown_r: null
  max_cost_share_of_gross_wins: 0.40
  near_threshold_margin_r: 0.03
  keep_best_per_strategy: 20
  detailed_records_max: 150
  by_split:
    validation:
      min_expectancy_r: 0.0
      strict_expectancy: true
      min_trades: 80
      min_profit_factor: 1.15
    final_oos:
      min_expectancy_r: 0.0
      strict_expectancy: true
      min_trades: 80
      min_profit_factor: 1.15

strategies:
  # Rolling close breakout with current volume above its rolling mean multiple.
  - plugin: exactbt.strategies.volume:BREAKOUT_VOLUME_PLUGIN
    enabled: true
    parameters:
      <<: *volume_execution
      volume_window: [20, 50, 100]
      volume_mult: [1.2, 1.5, 2.0]
      lookback: [48, 96, 192, 384]

  # ROC threshold cross with the same relative-volume confirmation.
  - plugin: exactbt.strategies.volume:MOMENTUM_VOLUME_PLUGIN
    enabled: true
    parameters:
      <<: *volume_execution
      roc_window: [6, 12, 24, 48]
      threshold: [0.5, 1.0, 1.5, 2.0]
      volume_window: [20, 50, 100]
      volume_mult: [1.2, 1.5, 2.0]
