# ExactBT v0.8 — focused PDH/PDL liquidity sweep + reclaim research.
#
# Purpose:
# - revisit the original stateful liquidity-sweep family from v0.2;
# - test same-candle and delayed reclaim through max_wait_candles;
# - use the actual sweep extreme for the stop;
# - separate long, short, and combined behavior.
#
# Scope is deliberately PDH/PDL in UTC trading days. Asia/London/New York session
# levels are not silently invented here; they require a separately declared time
# model and a new experiment.

data:
  file: data/btcusdt_15m.parquet
  timestamp_column: auto
  active_split: train
  splits:
    train:
      start: "2021-01-01T00:00:00Z"
      end: "2024-07-01T00:00:00Z"
      locked: false
    validation:
      start: "2024-07-01T00:00:00Z"
      end: "2025-07-01T00:00:00Z"
      locked: false
    final_oos:
      start: "2025-07-01T00:00:00Z"
      end: "2026-07-01T00:00:00Z"
      locked: true

engine:
  fee_per_side: 0.0005
  slippage_per_side: 0.0002
  cancel_pending_on_new_day: true

search:
  output_dir: results
  batch_size: 48
  num_threads: 0
  shortlist_file: null

selection:
  min_expectancy_r: 0.15
  strict_expectancy: true
  min_trades: 300
  min_profit_factor: 1.3
  max_drawdown_r: null
  max_cost_share_of_gross_wins: 0.40
  near_threshold_margin_r: 0.03
  keep_best_per_strategy: 20
  detailed_records_max: 150
  by_split:
    validation:
      min_expectancy_r: 0.0
      strict_expectancy: true
      min_trades: 80
      min_profit_factor: 1.15
    final_oos:
      min_expectancy_r: 0.0
      strict_expectancy: true
      min_trades: 80
      min_profit_factor: 1.15

strategies:
  - plugin: exactbt.strategies.liquidity_sweep:PLUGIN
    enabled: true
    parameters:
      sweep_buffer_ratio: [0.0, 0.00025, 0.0005]
      reclaim_buffer_ratio: [0.0, 0.00025, 0.0005]
      max_wait_candles: [1, 2, 4, 8]
      stop_buffer_ratio: [0.0, 0.0001, 0.0002]
      risk_reward: [1.0, 1.5, 2.0, 2.5, 3.0]
      max_hold_bars: [16, 32, 64]
      side: [both, long, short]
