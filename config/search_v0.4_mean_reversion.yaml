# ExactBT v0.4 — focused mean-reversion research.
#
# Purpose:
# - revisit the four mean-reversion families from the broad v0.2 scan;
# - keep their existing close-confirmed signal definitions;
# - replace the old shared coarse execution grid with shorter holds, tighter stops,
#   lower fixed-R targets, and explicit long/short separation.
#
# This is a new TRAIN experiment. Do not rewrite v0.2 or v0.3 results with it.

mean_reversion_execution: &mean_reversion_execution
  atr_stop_window: [14]
  atr_stop_multiplier: [1.0, 1.5, 2.0]
  risk_reward: [0.75, 1.0, 1.25, 1.5]
  max_hold_bars: [16, 32, 64]
  side: [both, long, short]

data:
  file: data/btcusdt_15m.parquet
  timestamp_column: auto
  active_split: train
  splits:
    train:
      start: "2021-01-01T00:00:00Z"
      end: "2024-07-01T00:00:00Z"
      locked: false
    validation:
      start: "2024-07-01T00:00:00Z"
      end: "2025-07-01T00:00:00Z"
      locked: false
    final_oos:
      start: "2025-07-01T00:00:00Z"
      end: "2026-07-01T00:00:00Z"
      locked: true

engine:
  fee_per_side: 0.0005
  slippage_per_side: 0.0002
  cancel_pending_on_new_day: true

search:
  output_dir: results
  batch_size: 48
  num_threads: 0
  # Freeze TRAIN candidates before VALIDATION, then set this in a copied config.
  shortlist_file: null

selection:
  # Keep the original hard research target. A lower diagnostic tier belongs in
  # analysis output, not in the definition of a passing strategy.
  min_expectancy_r: 0.15
  strict_expectancy: true
  min_trades: 300
  min_profit_factor: 1.3
  max_drawdown_r: null
  max_cost_share_of_gross_wins: 0.40
  near_threshold_margin_r: 0.03
  keep_best_per_strategy: 20
  detailed_records_max: 150
  by_split:
    validation:
      min_expectancy_r: 0.0
      strict_expectancy: true
      min_trades: 80
      min_profit_factor: 1.15
    final_oos:
      min_expectancy_r: 0.0
      strict_expectancy: true
      min_trades: 80
      min_profit_factor: 1.15

strategies:
  # Close moved back inside the Bollinger band after closing outside it.
  - plugin: exactbt.strategies.mean_reversion:BOLLINGER_REENTRY_PLUGIN
    enabled: true
    parameters:
      <<: *mean_reversion_execution
      window: [20, 40, 60]
      std_mult: [1.5, 2.0, 2.5]
      regime_ema: [100, 200]

  # Wick crossed the band while the candle closed back inside it.
  - plugin: exactbt.strategies.mean_reversion:BOLLINGER_FADE_PLUGIN
    enabled: true
    parameters:
      <<: *mean_reversion_execution
      window: [20, 40, 60]
      std_mult: [1.5, 2.0, 2.5]
      regime_ema: [100, 200]

  # Z-score crossed back toward its rolling mean after an extreme excursion.
  - plugin: exactbt.strategies.mean_reversion:ZSCORE_REVERSION_PLUGIN
    enabled: true
    parameters:
      <<: *mean_reversion_execution
      window: [20, 40, 60, 96]
      zscore_threshold: [1.0, 1.5, 2.0, 2.5]

  # RSI recovered from an oversold/overbought extreme in the EMA regime.
  - plugin: exactbt.strategies.mean_reversion:RSI_EXTREME_PLUGIN
    enabled: true
    parameters:
      <<: *mean_reversion_execution
      rsi_window: [7, 14, 21]
      level: [20, 25, 30, 35]
      regime_ema: [100, 200]
