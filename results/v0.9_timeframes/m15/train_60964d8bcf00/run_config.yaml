# ExactBT v0.9 - trend following tan suat cao tren BTC M15.
#
# So sanh timeframe co kiem soat, tham khao cau truc config/v0.6:
# - logic chien luoc va parameter grid giong nhau tren tat ca timeframe;
# - chi thay dataset, output_dir va min_trades theo do dai nen;
# - muc tieu la tim trend continuation/breakout co expectancy duong sau phi;
# - day la search space nghien cuu, khong phai cam ket loi nhuan.
#
# Cach dieu chinh:
# - neu qua it config pass: xem phan bo trade truoc, sau do giam min_trades nhe;
# - neu nhieu trade nhung PF thap: tang adx_threshold hoac bo pullback_atr 1.00;
# - khong ha gate expectancy/PF chi de ep co ket qua.

pullback_execution: &pullback_execution
  atr_stop_window: [14]
  atr_stop_multiplier: [1.5, 2.0, 2.5]
  risk_reward: [1.5, 2.0, 2.5]
  max_hold_bars: [32, 64, 96]
  side: [both, long, short]

breakout_execution: &breakout_execution
  atr_stop_window: [14]
  atr_stop_multiplier: [1.5, 2.0, 2.5]
  risk_reward: [1.5, 2.0, 2.5, 3.0]
  max_hold_bars: [32, 64, 96, 192]
  side: [both, long, short]

data:
  file: ../data/btc/m15/BTCUSD_M15_20200101_20260623_binance_futures.parquet
  timestamp_column: auto
  active_split: train
  splits:
    train:
      start: "2021-01-01T00:00:00Z"
      end: "2024-07-01T00:00:00Z"
      locked: false
    validation:
      start: "2024-07-01T00:00:00Z"
      end: "2025-07-01T00:00:00Z"
      locked: false
    final_oos:
      start: "2025-07-01T00:00:00Z"
      end: "2026-07-01T00:00:00Z"
      locked: true

engine:
  fee_per_side: 0.0005
  slippage_per_side: 0.0002
  cancel_pending_on_new_day: true

search:
  output_dir: ../results/v0.9_timeframes/m15
  batch_size: 96
  num_threads: 0
  shortlist_file: null

selection:
  # Gate trade duoc scale tu baseline M15: TRAIN 630, VALIDATION/OOS 180.
  # Scale theo do dai nen giong cach v0.6 so sanh cac timeframe.
  min_trades: 630
  min_expectancy_r: 0.08
  strict_expectancy: true
  min_profit_factor: 1.15
  max_drawdown_r: 35
  max_cost_share_of_gross_wins: 0.45
  near_threshold_margin_r: 0.03
  keep_best_per_strategy: 40
  detailed_records_max: 300
  by_split:
    validation:
      min_trades: 180
      min_expectancy_r: 0.0
      strict_expectancy: true
      min_profit_factor: 1.10
      max_drawdown_r: 20
    final_oos:
      min_trades: 180
      min_expectancy_r: 0.0
      strict_expectancy: true
      min_profit_factor: 1.10
      max_drawdown_r: 20

strategies:
  - plugin: exactbt.strategies.research:ADX_EMA_PULLBACK_PLUGIN
    enabled: true
    parameters:
      <<: *pullback_execution
      fast_ema: [10, 20, 50]
      slow_ema: [100, 200]
      adx_window: [14]
      adx_threshold: [12, 15, 18, 22]
      pullback_lookback: [2, 4, 8]
      require_di: [false, true]

  - plugin: exactbt.strategies.trend:EMA_SLOPE_PULLBACK_PLUGIN
    enabled: true
    parameters:
      <<: *pullback_execution
      ema_window: [20, 50, 100, 200]
      slope_lookback: [4, 8, 16]
      atr_window: [14, 21]
      pullback_atr: [0.25, 0.50, 0.75, 1.00]

  - plugin: exactbt.strategies.trend:ROLLING_RANGE_BREAKOUT_PLUGIN
    enabled: true
    parameters:
      <<: *breakout_execution
      lookback: [16, 24, 32, 48, 72, 96]
      atr_window: [14, 21]
      breakout_atr_buffer: [0.0, 0.10, 0.25]
      regime_ema: [50, 100, 200]
